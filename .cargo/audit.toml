# Configuration for cargo-audit, run by .github/workflows/security-audit.yml
# Keep this list in sync with the `ignore` list in ../deny.toml.

[advisories]
ignore = [
  # rustls-pemfile is unmaintained. Used in src/tls/probe.rs only to parse
  # local PEM files supplied by the operator; the eventual replacement is the
  # `pem` module of rustls-pki-types.
  "RUSTSEC-2025-0134",
]
