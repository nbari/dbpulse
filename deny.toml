# Configuration for cargo-deny, run by .github/workflows/security-audit.yml
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
ignore = [
  # rustls-pemfile is unmaintained. It is used in src/tls/probe.rs only to
  # parse local PEM files supplied by the operator; the eventual replacement is
  # the `pem` module of rustls-pki-types.
  { id = "RUSTSEC-2025-0134", reason = "unmaintained; migration to rustls-pki-types pending" },
]
# Yanked crates are reported but do not fail the build: they are usually
# resolved by an upstream release rather than by anything in this repo.
yanked = "warn"

[licenses]
# Permissive licenses accepted for this project; this covers everything
# currently in the dependency graph. Adding a crate whose license is not listed
# here fails CI, which is deliberate: it should be a decision, not an accident.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are common in a graph this size and are not a security
# issue on their own.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
